openapi: 3.0.3
info:
  title: trainingApp API
  description: Сервис учёта тренировок и аналитики нагрузки.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальная разработка

tags:
  - name: health
  - name: auth
  - name: exercises
  - name: workouts
  - name: sets
  - name: stats
  - name: weights

paths:
  /health:
    get:
      tags: [health]
      summary: Проверка жизни сервиса
      security: []
      responses:
        "200":
          description: Сервис доступен

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Аутентификация, выдача JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Токен выдан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/exercises:
    get:
      tags: [exercises]
      summary: Каталог упражнений
      description: Возвращает системные упражнения и личные упражнения текущего пользователя.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Список упражнений
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [exercises]
      summary: Создать личное упражнение
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExerciseRequest" }
      responses:
        "201":
          description: Упражнение создано
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [exercises]
      summary: Упражнение по идентификатору
      responses:
        "200":
          description: Упражнение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [exercises]
      summary: Изменить личное упражнение
      description: Системные упражнения через API не изменяются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExerciseRequest" }
      responses:
        "200":
          description: Упражнение изменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [exercises]
      summary: Удалить личное упражнение
      responses:
        "204":
          description: Упражнение удалено
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/exercises/{id}/muscles:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [exercises]
      summary: Мышечные группы упражнения
      responses:
        "200":
          description: Список связей
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Muscle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [exercises]
      summary: Заменить набор мышечных групп
      description: >
        Набор заменяется целиком в одной транзакции. Ровно одна группа должна иметь
        роль primary, повторы muscle_group_id запрещены.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 20
              items: { $ref: "#/components/schemas/Muscle" }
      responses:
        "200":
          description: Новый набор связей
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Muscle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/muscle-groups:
    get:
      tags: [exercises]
      summary: Справочник мышечных групп
      description: Полный список групп с указанием региона, в порядке отображения.
      responses:
        "200":
          description: Список мышечных групп
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MuscleGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/muscle-groups/{code}/exercises:
    get:
      tags: [exercises]
      summary: Упражнения, нагружающие мышечную группу
      description: >
        Системные упражнения и личные упражнения текущего пользователя,
        связанные с группой. Сначала те, где группа основная (primary).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 50 }
          example: biceps
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Список упражнений с ролью группы в каждом
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExerciseWithRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/workouts:
    get:
      tags: [workouts]
      summary: Тренировки пользователя
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Список тренировок, свежие первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [workouts]
      summary: Начать тренировку
      description: При отсутствии started_at используется текущее время сервера.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutRequest" }
      responses:
        "201":
          description: Тренировка создана
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [workouts]
      summary: Тренировка по идентификатору
      responses:
        "200":
          description: Тренировка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [workouts]
      summary: Изменить заметку тренировки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutRequest" }
      responses:
        "200":
          description: Тренировка изменена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [workouts]
      summary: Удалить тренировку
      description: Подходы тренировки удаляются каскадно.
      responses:
        "204":
          description: Тренировка удалена
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/workouts/finish/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [workouts]
      summary: Завершить тренировку
      description: >
        Проставляет ended_at текущим временем. Повторное завершение уже завершённой
        тренировки возвращает 404.
      responses:
        "200":
          description: Тренировка завершена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/sets:
    post:
      tags: [sets]
      summary: Добавить подход
      description: >
        Подход добавляется только в тренировку текущего пользователя; принадлежность
        проверяется в самом запросе вставки.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSetRequest" }
      responses:
        "201":
          description: Подход добавлен
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/sets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [sets]
      summary: Подход по идентификатору
      responses:
        "200":
          description: Подход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [sets]
      summary: Изменить подход
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSetRequest" }
      responses:
        "200":
          description: Подход изменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [sets]
      summary: Удалить подход
      responses:
        "204":
          description: Подход удалён
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/sets/byWorkout/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [sets]
      summary: Подходы тренировки
      responses:
        "200":
          description: Список подходов, упорядоченный по номеру
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/weights:
    get:
      tags: [weights]
      summary: История веса пользователя
      parameters:
        - name: from
          in: query
          description: Начало периода включительно. По умолчанию — год назад.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Конец периода включительно. По умолчанию — сегодня.
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Замеры веса, свежие первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BodyWeight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [weights]
      summary: Записать вес
      description: >
        На одну дату приходится один замер: повторная запись за ту же дату
        обновляет существующую. Без measured_on используется сегодняшний день.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyWeightRequest" }
      responses:
        "201":
          description: Замер сохранён
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyWeight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/weights/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    delete:
      tags: [weights]
      summary: Удалить замер веса
      responses:
        "204":
          description: Замер удалён
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/stats:
    get:
      tags: [stats]
      summary: Сводная статистика нагрузки
      description: >
        Возвращает сводку за период, распределение объёма по мышечным группам и
        персональные рекорды. Независимые выборки собираются параллельно.
        Объём считается как сумма произведений повторов на вес; вклад мышечной
        группы в роли secondary учитывается с коэффициентом 0.5.
      parameters:
        - name: from
          in: query
          description: Начало периода включительно. По умолчанию — 90 дней назад.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Конец периода не включая. По умолчанию — текущий момент.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Статистика за период
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Токен отсутствует, некорректен или истёк
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ресурс не найден или принадлежит другому пользователю
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Запрос корректен синтаксически, но нарушает правила предметной области
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Dashboard:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        summary: { $ref: "#/components/schemas/Summary" }
        muscles:
          type: array
          description: Мышечные группы, упорядоченные по убыванию объёма.
          items: { $ref: "#/components/schemas/MuscleLoad" }
        records:
          type: array
          description: Лучший подход по каждому упражнению, не более 20 записей.
          items: { $ref: "#/components/schemas/Record" }

    Period:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    Summary:
      type: object
      properties:
        workouts: { type: integer, format: int64 }
        sets: { type: integer, format: int64 }
        reps: { type: integer, format: int64 }
        volume: { type: number, format: double }

    MuscleLoad:
      type: object
      properties:
        code: { type: string, description: Технический код мышечной группы. }
        name: { type: string }
        region: { type: string, description: Регион, объединяющий группу. }
        volume:
          type: number
          format: double
          description: Объём с учётом коэффициента роли.
        reps: { type: integer, format: int64 }
        sets: { type: integer, format: int64 }

    Record:
      type: object
      properties:
        exercise_id: { type: integer, format: int64 }
        exercise_name: { type: string }
        weight_kg:
          type: number
          format: double
          nullable: true
          description: null — подход с весом тела.
        reps: { type: integer }
        achieved_at: { type: string, format: date-time }

    BodyWeight:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        weight_kg: { type: number, format: float }
        measured_on: { type: string, format: date }
        note: { type: string }
        created_at: { type: string, format: date-time }

    BodyWeightRequest:
      type: object
      properties:
        weight_kg: { type: number, format: float, minimum: 20, maximum: 500 }
        measured_on:
          type: string
          format: date
          description: По умолчанию — сегодняшняя дата.
        note: { type: string, maxLength: 200 }
      required: [weight_kg]

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    RegisterRequest:
      type: object
      properties:
        username: { type: string, maxLength: 100 }
        second_name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
      required: [username, second_name, email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
      required: [token, expires_at]

    User:
      type: object
      description: Хеш пароля не сериализуется ни при каких условиях.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        second_name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }

    ExerciseRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
      required: [name]

    Exercise:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        user_id:
          type: integer
          format: int64
          nullable: true
          description: null — системное упражнение, доступное всем пользователям.
        created_at: { type: string, format: date-time }

    ExerciseWithRole:
      allOf:
        - $ref: "#/components/schemas/Exercise"
        - type: object
          properties:
            role:
              type: string
              enum: [primary, secondary]

    MuscleGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: Технический код группы. }
        name: { type: string }
        region_code: { type: string }
        region_name: { type: string }

    Muscle:
      type: object
      properties:
        muscle_group_id: { type: integer, format: int64 }
        role:
          type: string
          enum: [primary, secondary]
      required: [muscle_group_id, role]

    WorkoutRequest:
      type: object
      properties:
        started_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }

    Workout:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: null — тренировка не завершена.
        note: { type: string }

    CreateSetRequest:
      type: object
      properties:
        exercise_id: { type: integer, format: int64 }
        workout_id: { type: integer, format: int64 }
        set_number: { type: integer, minimum: 1, maximum: 30 }
        reps: { type: integer, minimum: 1, maximum: 5000 }
        weight: { type: number, format: float, minimum: 0, maximum: 350 }
      required: [exercise_id, workout_id, set_number, reps, weight]

    UpdateSetRequest:
      type: object
      properties:
        set_number: { type: integer, minimum: 1, maximum: 30 }
        reps: { type: integer, minimum: 1, maximum: 5000 }
        weight: { type: number, format: float, minimum: 0, maximum: 350 }
      required: [set_number, reps, weight]

    Set:
      type: object
      properties:
        id: { type: integer, format: int64 }
        exercise_id: { type: integer, format: int64 }
        workout_id: { type: integer, format: int64 }
        set_number: { type: integer }
        reps: { type: integer }
        weight: { type: number, format: float }
        created_at: { type: string, format: date-time }

security:
  - bearerAuth: []
